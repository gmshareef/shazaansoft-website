<style>
  :root{
    --emerald-600:#059669;
    --emerald-500:#10b981;
    --emerald-50:#ecfdf5;
    --indigo-600:#6366f1;
    --violet-600:#7c3aed;
    --slate-900:#0f172a;
    --slate-700:#334155;
    --slate-500:#64748b;
    --slate-300:#cbd5e1;
    --slate-200:#e2e8f0;
    --slate-100:#f1f5f9;
    --slate-50:#f8fafc;
    --white:#ffffff;
    --amber-500:#f59e0b;
    --rose-500:#f43f5e;
    --radius-lg:1.5rem;
    --radius-md:1rem;
    --radius-sm:0.75rem;
    --shadow-soft:0 20px 45px -20px rgba(15,23,42,0.22);
    --shadow-tight:0 8px 20px -10px rgba(15,23,42,0.18);
    --font-display:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    color:var(--slate-700);
    background:var(--white);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;}
  h1,h2,h3,h4{font-family:var(--font-display);color:var(--slate-900);line-height:1.15;}
  .container{width:100%;max-width:1160px;margin:0 auto;padding:0 24px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-display);font-weight:800;font-size:11px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--emerald-600);
    background:var(--emerald-50);border:1px solid #d1fae5;
    padding:6px 14px;border-radius:999px;
  }
  .grad-text{
    background:linear-gradient(100deg, var(--emerald-600), var(--indigo-600) 65%, var(--violet-600));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    font-family:var(--font-display);font-weight:700;font-size:14.5px;
    padding:14px 26px;border-radius:999px;border:2px solid transparent;
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:linear-gradient(100deg, var(--emerald-600), var(--emerald-500));
    color:var(--white);box-shadow:0 14px 30px -12px rgba(5,150,105,0.55);
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 34px -12px rgba(5,150,105,0.65);}
  .btn-outline{
    background:var(--white);color:var(--slate-900);border-color:var(--slate-200);
  }
  .btn-outline:hover{border-color:var(--slate-900);transform:translateY(-2px);}
  .btn-ghost{ color:var(--slate-700); }
  .btn svg{width:18px;height:18px;flex-shrink:0;}
  .btn-sm{padding:10px 18px;font-size:13px;}

  /* ---------- Nav ---------- */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--slate-100);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--slate-900);}
  .brand .logo-mark{width:38px;height:38px;flex-shrink:0;}
  
  /* WhatsApp Button Specific Overrides */
  .whatsapp-btn {
    background: #00a884 !important;
    color: var(--white) !important;
    box-shadow: 0 10px 24px -10px rgba(0, 168, 132, 0.45) !important;
  }
  .whatsapp-btn:hover {
    background: #008f6f !important;
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -10px rgba(0, 168, 132, 0.55) !important;
  }

  .nav-links{display:flex;align-items:center;gap:36px;}
  .nav-links a{
    font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--slate-700);
    transition:color .15s ease;
  }
  .nav-links a:hover{color:var(--emerald-600);}
  .nav-actions{display:flex;align-items:center;gap:14px;}
  
  .hamburger{
    display:none;flex-direction:column;justify-content:center;gap:5px;
    width:40px;height:40px;border:1px solid var(--slate-200);border-radius:10px;
    background:var(--white);cursor:pointer;
  }
  .hamburger span{display:block;width:18px;height:2px;background:var(--slate-900);margin:0 auto;transition:transform .2s ease, opacity .2s ease;}
  .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .hamburger.open span:nth-child(2){opacity:0;}
  .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  
  .mobile-panel{
    display:none;flex-direction:column;gap:4px;
    padding:16px 24px 24px;border-top:1px solid var(--slate-100);
    background:var(--white);
    position: fixed;top: 78px;left: 0;right: 0;z-index: 99;
    border-bottom: 1px solid var(--slate-200);
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
  }
  .mobile-panel.open{display:flex;}
  .mobile-panel a{
    font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--slate-800);
    padding:12px 4px;border-bottom:1px solid var(--slate-100);
  }
  .mobile-panel .btn{margin-top:12px;width:100%;}

  /* Responsive Adjustments */
  @media(max-width: 868px) {
    .nav-links, .nav-actions { display: none; }
    .hamburger { display: flex; }
  }

  /* ---------- Hero ---------- */
  .hero{position:relative;padding:76px 0 90px;overflow:hidden;}
  .hero::before{
    content:'';position:absolute;top:-160px;right:-160px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(99,102,241,0.14), transparent 70%);pointer-events:none;
  }
  .hero::after{
    content:'';position:absolute;bottom:-200px;left:-160px;width:480px;height:480px;border-radius:50%;
    background:radial-gradient(circle, rgba(16,185,129,0.14), transparent 70%);pointer-events:none;
  }
  .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;position:relative;z-index:1;}
  .hero h1{font-size:clamp(32px, 4.2vw, 50px);font-weight:800;letter-spacing:-0.01em;margin:20px 0 22px;}
  .hero p.lead{font-size:17px;color:var(--slate-500);max-width:520px;margin-bottom:32px;}
  .hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px;}
  .hero-note{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--slate-500);font-weight:500;}
  .hero-note svg{width:16px;height:16px;color:var(--emerald-600);flex-shrink:0;}

  /* Responsive Hero */
  @media(max-width: 768px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .hero { padding: 40px 0 60px; }
  }

  /* ---------- Hero mockup panel ---------- */
  .mock-window{
    background:var(--white);border-radius:22px;box-shadow:var(--shadow-soft);
    border:1px solid var(--slate-100);overflow:hidden;transform:rotate(1.2deg);
  }
  .mock-topbar{
    display:flex;align-items:center;gap:6px;padding:14px 18px;
    background:linear-gradient(100deg, var(--slate-900), #1e293b);
  }
  .mock-topbar span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.25);}
  .mock-topbar span:nth-child(1){background:#f87171;}
  .mock-topbar span:nth-child(2){background:#fbbf24;}
  .mock-topbar span:nth-child(3){background:#34d399;}
  .mock-body{padding:22px;}
  .mock-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .mock-stat{
    background:var(--slate-50);border:1px solid var(--slate-100);border-radius:14px;padding:14px 12px;
  }
  .mock-stat .mock-label{display:block;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate-500);margin-bottom:6px;}
  .mock-stat .mock-value{display:block;font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--slate-900);}
</style>
</head>
